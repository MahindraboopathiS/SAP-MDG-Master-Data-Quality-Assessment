name: Continuous Integration Checks

on:
  push:
    branches: [ master, develop, staging, "feat/*", "feature/*", "fix/*" ]
  pull_request:
    branches: [ master, develop, staging ]

jobs:
  validate-mocks:
    name: Validate Mock Datasets & Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Validate Mock JSON Datasets
        run: node scripts/validate_json_mocks.js
